<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laburator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        h1, h2, h3 { margin: 0.5em 0; color: #1a1a1a; }
        .card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        label { display: block; margin: 12px 0 4px; font-weight: 600; }
        textarea, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; }
        textarea { min-height: 300px; resize: vertical; }
        button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .output-editor { font-family: "SF Mono", "Fira Code", "Consolas", monospace; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 20px; margin-top: 16px; min-height: 300px; max-height: 600px; font-size: 14px; line-height: 1.5; }
        .action-bar { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .loading { color: #6b7280; font-style: italic; }
        .success-msg { color: #16a34a; font-size: 13px; margin-left: 8px; }
        .badge { display: inline-block; background: #e5e7eb; color: #374151; border-radius: 4px; padding: 2px 8px; font-size: 12px; margin-left: 8px; }
        .btn-save { background: #16a34a; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
        .btn-save:hover { background: #15803d; }
        .btn-pdf { background: #dc2626; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
        .btn-pdf:hover { background: #b91c1c; }
        .file-list { list-style: none; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 8px; background: white; }
        .file-item a { color: #2563eb; text-decoration: none; font-weight: 600; }
        .file-item a:hover { text-decoration: underline; }
        .btn-secondary { background: #6b7280; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-size: 14px; cursor: pointer; margin-left: 8px; }
        .btn-secondary:hover { background: #4b5563; }
        .path { font-size: 12px; color: #6b7280; background: #f3f4f6; padding: 8px; border-radius: 4px; word-break: break-all; margin-bottom: 16px; font-family: monospace; }
        .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 2px solid #e5e7eb; padding-bottom: 0; }
        .tab-btn { padding: 12px 24px; border: 1px solid #e5e7eb; border-bottom: none; border-radius: 8px 8px 0 0; background: #f9fafb; color: #6b7280; cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.2s; margin: 0; }
        .tab-btn:hover { background: #f3f4f6; color: #374151; }
        .tab-btn.active { background: white; color: #2563eb; border-color: #d1d5db; border-bottom: 2px solid white; margin-bottom: -2px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .cv-status { font-size: 12px; margin-left: 12px; }
        .cv-status.exists { color: #16a34a; }
        .cv-status.missing { color: #dc2626;         }
        .disclosure {
            cursor: pointer;
            font-size: 10px;
            user-select: none;
            display: inline-block;
            transition: transform 0.2s;
            color: #6b7280;
        }
        .disclosure.open {
            transform: rotate(90deg);
        }
        .job-md-panel {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 12px;
            margin: 4px 0;
            max-height: 400px;
            overflow-y: auto;
        }
        .job-md-panel pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 16px;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #6b7280;
        }
        .modal-close:hover {
            color: #111;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-body pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.6;
        }
        .modal-body.loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <h1>🛠️ Laburator — Entradas Manuales</h1>

    <div class="tabs">
        <button class="tab-btn active" data-tab="generator">⚡ Generar</button>
                <button class="tab-btn" data-tab="cv"><i class="fa-regular fa-file-lines"></i> Mi CV</button>
    </div>

    <!-- ── Tab: Generator ──────────────────────────────── -->
    <div id="tab-generator" class="tab-content active">
        <div class="card">
            <h2>Generar</h2>
            <label for="jobDescription">Job Description (todo el texto)</label>
            <textarea id="jobDescription" placeholder="Pega aquí el completo job description..."></textarea>

            <label for="jobLink">Link (opcional) <span style="font-weight:400;color:#6b7280;">— se usará como carpeta para agrupar generados</span></label>
            <input id="jobLink" type="text" placeholder="Ej: linkedin.com/jobs/view/12345 o el nombre que quieras" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:14px;">

            <label for="skill" style="margin-top:16px;">Skill a aplicar</label>
            <select id="skill">
                <option value="jobsynthesis">Análisis de puesto</option>
                <option value="createcv">CV personalizado con análisis ATS</option>
                <option value="presentationletter">Carta de presentación</option>
                <option value="interviewquestions">Preguntas de entrevista</option>
            </select>

            <button id="generateBtn" onclick="generate()" style="margin-top: 12px;">Generar</button>
            <div id="loading" class="loading" style="display:none; margin-top: 12px;">Generando...</div>
            <div id="resultArea" style="display:none;">
                <label for="result">Resultado <span id="fileBadge" class="badge"></span></label>
                <textarea id="result" class="output-editor" placeholder="El contenido generado aparecerá aquí..."></textarea>
                <div class="action-bar">
                    <button id="saveBtn" class="btn-save" onclick="saveFile()">💾 Guardar</button>
                    <button id="pdfBtn" class="btn-pdf" onclick="openPdf()"><i class="fa-regular fa-file-pdf"></i> PDF</button>
                    <a id="downloadLink" class="btn-secondary" target="_blank">Ver archivo</a>
                    <button onclick="copyPath()" class="btn-secondary">Copiar ruta</button>
                    <span id="saveStatus" class="success-msg" style="display:none;"></span>
                    <div id="copied" style="display:none; margin-left: 8px; color: #16a34a; font-size: 13px;">¡Copiado!</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Directorio de salida</h2>
            <div class="path" id="outputDirPath"></div>
            <ul class="file-list" id="fileList"></ul>
            <div class="pagination" id="pagination" style="margin-top: 16px; display: flex; gap: 8px; align-items: center; justify-content: center;"></div>
        </div>
    </div>

    <!-- ── Tab: CV ─────────────────────────────────────── -->
    <div id="tab-cv" class="tab-content">
        <div class="card">
            <h2>Curriculum Vitae</h2>
            <p>Este CV se usa como contexto al generar contenidos.</p>
            <div class="path" id="cvPath"></div>
            <textarea id="cvEditor" class="output-editor" placeholder="Escribí tu CV en markdown..."></textarea>
            <div class="action-bar">
                <button class="btn-save" onclick="saveCv()">💾 Guardar CV</button>
                <span id="cvStatus" class="success-msg" style="display:none;"></span>
            </div>
        </div>
    </div>

    <script>
        let currentRelPath = null;

        // ── Tab switching ─────────────────────────────────
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });

        // ── CV ────────────────────────────────────────────
        async function loadCv() {
            try {
                const res = await fetch('/api/cv');
                const data = await res.json();
                document.getElementById('cvPath').textContent = data.path;
                document.getElementById('cvEditor').value = data.content || '';
                const status = document.getElementById('cvStatus');
                if (data.exists) {
                    status.textContent = '✅ CV cargado';
                    status.className = 'success-msg exists';
                } else {
                    status.textContent = '⚠️ No existe. Escribí tu CV y guardalo.';
                    status.className = 'success-msg missing';
                }
                status.style.display = 'inline';
            } catch (e) {
                alert('Error al cargar CV: ' + e.message);
            }
        }

        async function saveCv() {
            const content = document.getElementById('cvEditor').value;
            const status = document.getElementById('cvStatus');
            try {
                const res = await fetch('/api/cv', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err);
                }
                status.textContent = '✅ CV guardado!';
                status.style.display = 'inline';
                setTimeout(() => { status.style.display = 'none'; }, 3000);
            } catch (e) {
                alert('Error al guardar CV: ' + e.message);
            }
        }

        // ── Generator ─────────────────────────────────────
        document.getElementById('outputDirPath').textContent = "{{ OUTPUT_DIR }}";

        async function generate() {
            const jobDesc = document.getElementById('jobDescription').value.trim();
            const skill = document.getElementById('skill').value;
            const link = document.getElementById('jobLink').value.trim();

            if (!jobDesc) {
                alert("Por favor, pega un job description.");
                return;
            }

            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('resultArea');
            const result = document.getElementById('result');

            btn.disabled = true;
            loading.style.display = 'block';
            resultArea.style.display = 'none';

            try {
                const res = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_description: jobDesc, skill: skill, link: link })
                });

                if (!res.ok) {
                    const err = await res.text();
                    throw new Error('Error: ' + err);
                }

                const data = await res.json();
                currentRelPath = data.rel_path;

                result.value = data.content;
                resultArea.style.display = 'block';

                document.getElementById('fileBadge').textContent = data.filename;

                const downloadElem = document.getElementById('downloadLink');
                downloadElem.href = '/api/file/' + encodeURIComponent(data.rel_path);

                clearStatus();
            } catch (e) {
                alert('Error: ' + e.message);
                console.error(e);
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        async function openPdf() {
            const content = document.getElementById('result').value;
            if (!content) return;
            const filename = currentRelPath
                ? currentRelPath.split('/').pop().replace('.md', '.pdf')
                : 'document.pdf';
            try {
                const res = await fetch('/api/pdf/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content, filename: filename })
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err);
                }
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                alert('Error al generar PDF: ' + e.message);
            }
        }

        async function saveFile() {
            if (!currentRelPath) return;
            const content = document.getElementById('result').value;
            const status = document.getElementById('saveStatus');

            try {
                const res = await fetch('/api/file/' + encodeURIComponent(currentRelPath), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err);
                }
                status.textContent = '✅ Guardado!';
                status.style.display = 'inline';
                setTimeout(() => { status.style.display = 'none'; }, 3000);
            } catch (e) {
                alert('Error al guardar: ' + e.message);
            }
        }

        let currentPage = 1;
        const PAGE_SIZE = 15;

        function toggleJobMd(id) {
            const panel = document.getElementById('md-' + id);
            const disc = document.getElementById('disc-' + id);
            if (!panel) return;
            const isOpen = panel.style.display !== 'none';
            panel.style.display = isOpen ? 'none' : 'block';
            if (disc) disc.classList.toggle('open', !isOpen);
        }

        async function refreshFiles() {
            const res = await fetch(`/api/outputs?page=${currentPage}&page_size=${PAGE_SIZE}`);
            const data = await res.json();
            const list = document.getElementById('fileList');
            list.innerHTML = '';

            if (!data.folders || data.folders.length === 0) {
                list.innerHTML = '<li style="color:#6b7280; padding:12px;">No hay archivos generados aún.</li>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            data.folders.forEach(folder => {
                const li = document.createElement('li');
                li.className = 'file-item';
                const dateStr = new Date(folder.modified * 1000).toLocaleDateString();
                let skillsHtml = '';


                // Other skill files
                folder.skills.forEach((sk, i) => {
                    const baseName = sk.filename.replace('.md', '');
                    const icon = baseName === 'presentation' ? 'fa-envelope' : baseName === 'cv' ? 'fa-file-lines' : baseName === 'interview' ? 'fa-circle-question' : baseName === 'jobsynthesis' ? 'fa-clipboard' : 'fa-file-lines';
                    skillsHtml += `
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="display:inline-flex; align-items:center; gap:4px; min-width:200px;">
                                <i class="fa-regular ${icon}"></i> ${baseName}
                            </span>
                            <a href="javascript:void(0)" onclick="showFileModal('${sk.rel_path}')" style="font-size:12px;"><i class="fa-regular fa-eye"></i></a>
                            <a href="/api/file/${encodeURIComponent(sk.rel_path)}?download=true" style="font-size:12px;"><i class="fa-solid fa-download"></i></a>
                            <a href="/api/pdf/${encodeURIComponent(sk.rel_path)}" target="_blank" style="font-size:12px;"><i class="fa-regular fa-file-pdf"></i></a>
                        </div>
                    `;
                });

                const liId = `folder-${folder.name.replace(/[^a-zA-Z0-9]/g, '_')}`;
                const hasMd = folder.job_md_content || false;

                let linkLine = '';
                if (folder.link) {
                    linkLine = `<div style="font-size:12px; word-break:break-all;">
                        <i class="fa-solid fa-link" style="color:#6b7280;"></i> <a href="${folder.link}" target="_blank" style="color:#2563eb;">${folder.link}</a>
                    </div>`;
                }
                if (hasMd) {
                    linkLine += `
                        <div style="font-size:12px; margin-top:2px;">
                            <span class="disclosure" onclick="toggleJobMd('${liId}')" id="disc-${liId}"><i class="fa-solid fa-chevron-right"></i></span>
                            <span class="disclosure" onclick="toggleJobMd('${liId}')" style="cursor:pointer; color:#6b7280;">ver detalle</span>
                        </div>
                    `;
                }

                const mdPanel = hasMd
                    ? `<div id="md-${liId}" class="job-md-panel" style="display:none;"><pre>${folder.job_md_content}</pre></div>`
                    : '';

                li.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:6px; width:100%;">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
                            <strong style="font-size:15px;">${folder.name}</strong>
                            <span style="font-size:12px; color:#6b7280;">${dateStr}</span>
                        </div>
                        ${linkLine}
                        ${mdPanel}
                        <div style="font-size:13px; display:flex; flex-direction:column; gap:4px;">
                            ${skillsHtml}
                        </div>
                    </div>
                `;
                list.appendChild(li);
            });

            // Pagination controls
            const pag = document.getElementById('pagination');
            pag.innerHTML = '';
            const prevBtn = document.createElement('button');
            prevBtn.className = 'btn-secondary';
            prevBtn.textContent = '‹ Anterior';
            prevBtn.disabled = data.page <= 1;
            prevBtn.onclick = () => { currentPage--; refreshFiles(); };
            pag.appendChild(prevBtn);

            const info = document.createElement('span');
            info.style.cssText = 'font-size: 13px; color: #6b7280;';
            info.textContent = `Pág. ${data.page} de ${data.total_pages} (${data.total} carpetas)`;
            pag.appendChild(info);

            const nextBtn = document.createElement('button');
            nextBtn.className = 'btn-secondary';
            nextBtn.textContent = 'Siguiente ›';
            nextBtn.disabled = data.page >= data.total_pages;
            nextBtn.onclick = () => { currentPage++; refreshFiles(); };
            pag.appendChild(nextBtn);
        }

        function copyPath() {
            const path = document.getElementById('outputDirPath').textContent;
            navigator.clipboard.writeText(path).then(() => {
                document.getElementById('copied').style.display = 'inline';
                setTimeout(() => {
                    document.getElementById('copied').style.display = 'none';
                }, 2000);
            });
        }

        function clearStatus() {
            document.getElementById('saveStatus').style.display = 'none';
        }

        window.addEventListener('load', () => {
            loadCv();
            refreshFiles();
            setInterval(refreshFiles, 5000);
        });
    </script>
    <!-- ── Modal ─────────────────────────────────────────── -->
    <div class="modal-overlay" id="fileModal" onclick="if(event.target===this) closeFileModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Archivo</h3>
                <button class="modal-close" onclick="closeFileModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <pre id="modalPre"></pre>
            </div>
        </div>
    </div>

    <script>
        function showFileModal(relPath) {
            const modal = document.getElementById('fileModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            const pre = document.getElementById('modalPre');
            title.textContent = relPath.split('/').pop();
            pre.textContent = 'Cargando...';
            body.className = 'modal-body loading';
            modal.classList.add('open');

            fetch('/api/file/' + encodeURIComponent(relPath))
                .then(r => {
                    if (!r.ok) throw new Error(r.statusText);
                    return r.text();
                })
                .then(text => {
                    body.className = 'modal-body';
                    pre.textContent = text;
                })
                .catch(err => {
                    body.className = 'modal-body';
                    pre.textContent = 'Error al cargar el archivo: ' + err.message;
                });
        }

        function closeFileModal() {
            document.getElementById('fileModal').classList.remove('open');
        }
    </script>
</body>
</html>
