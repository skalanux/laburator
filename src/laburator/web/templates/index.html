<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laburator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f3f6fb; }
        a { color: #2571aa; }
        a:hover { color: #1e5d8c; }
        h1, h2, h3 { margin: 0.5em 0; }
        h2 { color: #103a62; }
        h1, h3 { color: #1a1a1a; }
        .card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        label { display: block; margin: 12px 0 4px; font-weight: 600; }
        textarea, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; }
        textarea { min-height: 300px; resize: vertical; }
        button { background: #2571aa; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #1e5d8c; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .output-editor { font-family: "SF Mono", "Fira Code", "Consolas", monospace; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 20px; margin-top: 16px; min-height: 300px; max-height: 600px; font-size: 14px; line-height: 1.5; }
        .action-bar { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .loading { color: #6b7280; font-style: italic; }
        .success-msg { color: #16a34a; font-size: 13px; margin-left: 8px; }
        .error-msg { color: #dc2626; font-size: 13px; margin-left: 8px; }
        .badge { display: inline-block; background: #e5e7eb; color: #374151; border-radius: 4px; padding: 2px 8px; font-size: 12px; margin-left: 8px; }
        .btn-save { background: #2571aa; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
        .btn-save:hover { background: #1e5d8c; }
        .btn-pdf { background: #2571aa; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
        .btn-pdf:hover { background: #1e5d8c; }
        .file-list { list-style: none; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 8px; background: white; }
        .file-item a { color: #2571aa; text-decoration: none; font-weight: 600; }
        .file-item a:hover { text-decoration: underline; }
        .btn-secondary { background: #103a62; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-size: 14px; cursor: pointer; }
        .btn-secondary:hover { background: #0d2f4f; }
        .btn-secondary[disabled] { background: #4a6b8a; cursor: not-allowed; }
        .btn-outline-primary { background: transparent; color: #2571aa; border: 1px solid #2571aa; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600; }
        .btn-outline-primary:hover { background: #dceaf5; }
        .path { font-size: 12px; color: #6b7280; background: #f3f4f6; padding: 8px; border-radius: 4px; word-break: break-all; margin-bottom: 16px; font-family: monospace; }
        .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 2px solid #e5e7eb; padding-bottom: 0; }
        .tab-btn { padding: 12px 24px; border: 1px solid #e5e7eb; border-bottom: none; border-radius: 8px 8px 0 0; background: #f9fafb; color: #6b7280; cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.2s; margin: 0; }
        .tab-btn:hover { background: #f3f4f6; color: #374151; }
        .tab-btn.active { background: white; color: #2571aa; border-color: #d1d5db; border-bottom: 2px solid white; margin-bottom: -2px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .cv-status { font-size: 12px; margin-left: 12px; }
        .cv-status.exists { color: #16a34a; }
        .cv-status.missing { color: #dc2626;         }

        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .job-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 12px; background: #fff; }
        .job-title { font-size: 16px; font-weight: 700; color: #103a62; margin-bottom: 4px; }
        .job-meta { font-size: 13px; color: #6b7280; margin-bottom: 8px; }
        .job-desc { font-size: 13px; color: #374151; margin: 8px 0; white-space: pre-wrap; }
        .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .pill-pending { background: #e5e7eb; color: #374151; }
        .pill-interested { background: #dcfce7; color: #166534; }
        .pill-rejected { background: #fee2e2; color: #991b1b; }
        .btn-sm { padding: 6px 10px; font-size: 13px; border-radius: 6px; }
        .btn-yes { background: #16a34a; }
        .btn-yes:hover { background: #15803d; }
        .btn-no { background: #dc2626; }
        .btn-no:hover { background: #b91c1c; }
        .btn-neutral { background: #6b7280; }
        .btn-neutral:hover { background: #4b5563; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 16px;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #6b7280;
        }
        .modal-close:hover {
            color: #111;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-body pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.6;
        }
        .modal-body.loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <h1 style="margin:0; line-height:0; text-align:center;"><img src="/assets/logo.png" alt="Laburator" style="height:200px; object-fit:cover; display:inline-block; border-radius:8px;"></h1>

    <div class="tabs">
        <button class="tab-btn active" data-tab="generator"><i class="fa-solid fa-wand-magic-sparkles"></i> Generar</button>
        <button class="tab-btn" data-tab="search"><i class="fa-solid fa-magnifying-glass"></i> Buscar propuestas</button>
        <button class="tab-btn" data-tab="cv"><i class="fa-regular fa-file-lines"></i> Mi CV</button>
    </div>

    <!-- ── Tab: Generator ──────────────────────────────── -->
    <div id="tab-generator" class="tab-content active">
        <div class="card">
            <h2>Puesto</h2>
            <label for="jobDescription">Job Description (todo el texto)</label>
            <textarea id="jobDescription" placeholder="Pega aquí el completo job description..."></textarea>

            <label for="jobLink">Link (opcional) <span style="font-weight:400;color:#6b7280;">— se usará como carpeta para agrupar generados</span></label>
            <input id="jobLink" type="text" placeholder="Ej: linkedin.com/jobs/view/12345 o el nombre que quieras" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:14px;">

            <label for="skill" style="margin-top:16px;">Skill a aplicar</label>
            <select id="skill">
                <option value="jobsynthesis">Análisis de puesto</option>
                <option value="generarcv">CV personalizado con análisis ATS</option>
                <option value="presentationletter">Carta de presentación</option>
                <option value="interviewquestions">Preguntas de entrevista</option>
            </select>

            <button id="generateBtn" onclick="generate()" style="margin-top: 12px;">Generar</button>
            <div id="loading" class="loading" style="display:none; margin-top: 12px;">Generando...</div>
            <div id="resultArea" style="display:none;">
                <label for="result">Resultado <span id="fileBadge" class="badge"></span></label>
                <textarea id="result" class="output-editor" placeholder="El contenido generado aparecerá aquí..."></textarea>
                <div class="action-bar">
                    <button id="saveBtn" class="btn-save" onclick="saveFile()"><i class="fa-regular fa-floppy-disk"></i> Guardar</button>
                    <button id="pdfBtn" class="btn-pdf" onclick="openPdf()"><i class="fa-regular fa-file-pdf"></i> PDF</button>
                    <a id="downloadLink" class="btn-save" target="_blank" style="padding:8px 16px; text-decoration:none;">Ver archivo</a>
                    <button onclick="copyPath()" class="btn-save" style="padding:8px 16px;">Copiar ruta</button>
                    <span id="saveStatus" class="success-msg" style="display:none;"></span>
                    <div id="copied" style="display:none; margin-left: 8px; color: #16a34a; font-size: 13px;">¡Copiado!</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Directorio de salida</h2>
            <div class="path" id="outputDirPath"></div>
            <ul class="file-list" id="fileList"></ul>
            <div class="pagination" id="pagination" style="margin-top: 16px; display: flex; gap: 8px; align-items: center; justify-content: center;"></div>
        </div>
    </div>

    <!-- ── Tab: Search ─────────────────────────────────── -->
    <div id="tab-search" class="tab-content">
        <div class="card">
            <h2>Buscar propuestas</h2>
            <div class="grid-2">
                <div>
                    <label for="searchQuery">Búsqueda (query)</label>
                    <input id="searchQuery" type="text" placeholder="Ej: python developer" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
                </div>
                <div>
                    <label for="searchSource">Fuente</label>
                    <select id="searchSource">
                        <option value="openninja">OpenNinja (jsearch)</option>
                        <option value="arbeitnow">Arbeitnow (gratis, sin key)</option>
                        <option value="remotive">Remotive (remoto, sin key)</option>
                        <option value="jobicy">Jobicy (remoto, sin key)</option>
                        <option value="apify_linkedin">Apify LinkedIn Jobs (token, crédito $5)</option>
                        <option value="apify_indeed">Apify Indeed Jobs (token, crédito $5)</option>
                    </select>
                </div>
                <div>
                    <label for="searchCountry">País</label>
                    <input id="searchCountry" type="text" value="us" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
                </div>
                <div>
                    <label for="searchPages">Páginas</label>
                    <input id="searchPages" type="number" min="1" max="10" value="1" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
                </div>
                <div>
                    <label for="searchDate">Fecha publicación</label>
                    <select id="searchDate">
                        <option value="all">Todas</option>
                        <option value="today">Hoy</option>
                        <option value="3days">Últimos 3 días</option>
                        <option value="week">Última semana</option>
                        <option value="month">Último mes</option>
                    </select>
                </div>
                <div>
                    <label for="searchEmployment">Tipo empleo</label>
                    <input id="searchEmployment" type="text" placeholder="fulltime,parttime,contractor" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
                </div>
            </div>
            <label style="margin-top:8px;"><input id="searchRemote" type="checkbox"> Solo remoto</label>
            <div class="action-bar">
                <button id="searchBtn" onclick="runSearch()"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
                <button class="btn-secondary" onclick="loadDiscoveryJobs()"><i class="fa-solid fa-rotate"></i> Recargar guardadas</button>
                <span id="searchStatus" class="loading" style="display:none;">Buscando...</span>
            </div>
        </div>

        <div class="card">
            <h2>Propuestas</h2>
            <div class="grid-2" style="margin-bottom:12px;">
                <div>
                    <label for="filterDecision">Estado</label>
                    <select id="filterDecision" onchange="loadDiscoveryJobs()">
                        <option value="">Todas</option>
                        <option value="pending">Pendientes</option>
                        <option value="interested">Me interesan</option>
                        <option value="rejected">No me interesan</option>
                    </select>
                </div>
                <div>
                    <label for="filterText">Filtrar texto</label>
                    <input id="filterText" type="text" placeholder="título, empresa, descripción..." oninput="debouncedLoadDiscoveryJobs()" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
                </div>
            </div>
            <div id="jobsCount" style="font-size:13px;color:#6b7280;margin-bottom:8px;"></div>
            <div id="jobsList"></div>
        </div>
    </div>

    <!-- ── Tab: CV ─────────────────────────────────────── -->
    <div id="tab-cv" class="tab-content">
        <div class="card">
            <h2>Curriculum Vitae</h2>
            <p>Este CV se usa como contexto al generar contenidos.</p>
            <div class="path" id="cvPath"></div>
            <textarea id="cvEditor" class="output-editor" placeholder="Escribí tu CV en markdown..."></textarea>
            <div class="action-bar">
                <button class="btn-save" onclick="saveCv()"><i class="fa-regular fa-floppy-disk"></i> Guardar CV</button>
                <button class="btn-outline-primary" onclick="downloadCv()"><i class="fa-solid fa-download"></i> Descargar</button>
                <button class="btn-outline-primary" onclick="pdfCv()"><i class="fa-regular fa-file-pdf"></i> PDF</button>
                <span id="cvStatus" class="success-msg" style="display:none;"></span>
            </div>
        </div>
    </div>

    <script>
        let currentRelPath = null;

        // ── Tab switching ─────────────────────────────────
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });

        // ── CV ────────────────────────────────────────────
        async function loadCv() {
            try {
                const res = await fetch('/api/cv');
                const data = await res.json();
                document.getElementById('cvPath').textContent = data.path;
                document.getElementById('cvEditor').value = data.content || '';
                const status = document.getElementById('cvStatus');
                if (data.exists) {
                    status.innerHTML = '<i class="fa-regular fa-circle-check"></i> CV cargado';
                    status.className = 'success-msg exists';
                } else {
                    status.innerHTML = '<i class="fa-regular fa-triangle-exclamation"></i> No existe. Escribí tu CV y guardalo.';
                    status.className = 'success-msg missing';
                }
                status.style.display = 'inline';
            } catch (e) {
                alert('Error al cargar CV: ' + e.message);
            }
        }

        async function saveCv() {
            const content = document.getElementById('cvEditor').value;
            const status = document.getElementById('cvStatus');
            try {
                const res = await fetch('/api/cv', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err);
                }
                status.innerHTML = '<i class="fa-regular fa-circle-check"></i> CV guardado!';
                status.style.display = 'inline';
                setTimeout(() => { status.style.display = 'none'; }, 3000);
            } catch (e) {
                alert('Error al guardar CV: ' + e.message);
            }
        }

        function downloadCv() {
            const a = document.createElement('a');
            a.href = '/api/cv?download=true';
            a.download = 'cv.md';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function pdfCv() {
            const content = document.getElementById('cvEditor').value;
            if (!content.trim()) {
                alert('No hay contenido para generar PDF.');
                return;
            }
            fetch('/api/pdf/convert', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content }),
            })
                .then(r => {
                    if (!r.ok) throw new Error('Error al generar PDF');
                    return r.blob();
                })
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'cv.pdf';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 10000);
                })
                .catch(err => alert('Error: ' + err.message));
        }

        // ── Generator ─────────────────────────────────────
        document.getElementById('outputDirPath').textContent = "{{ OUTPUT_DIR }}";

        async function generate() {
            const jobDesc = document.getElementById('jobDescription').value.trim();
            const skill = document.getElementById('skill').value;
            const link = document.getElementById('jobLink').value.trim();

            if (!jobDesc) {
                alert("Por favor, pega un job description.");
                return;
            }

            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('resultArea');
            const result = document.getElementById('result');

            btn.disabled = true;
            loading.style.display = 'block';
            resultArea.style.display = 'none';

            try {
                const res = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_description: jobDesc, skill: skill, link: link })
                });

                if (!res.ok) {
                    const err = await res.text();
                    throw new Error('Error: ' + err);
                }

                const data = await res.json();
                currentRelPath = data.rel_path;

                result.value = data.content;
                resultArea.style.display = 'block';

                document.getElementById('fileBadge').textContent = data.filename;

                const downloadElem = document.getElementById('downloadLink');
                downloadElem.href = '/api/file/' + encodeURIComponent(data.rel_path);

                clearStatus();
            } catch (e) {
                alert('Error: ' + e.message);
                console.error(e);
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        async function openPdf() {
            const content = document.getElementById('result').value;
            if (!content) return;
            const filename = currentRelPath
                ? currentRelPath.split('/').pop().replace('.md', '.pdf')
                : 'document.pdf';
            try {
                const res = await fetch('/api/pdf/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content, filename: filename })
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err);
                }
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                alert('Error al generar PDF: ' + e.message);
            }
        }

        async function saveFile() {
            if (!currentRelPath) return;
            const content = document.getElementById('result').value;
            const status = document.getElementById('saveStatus');

            try {
                const res = await fetch('/api/file/' + encodeURIComponent(currentRelPath), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err);
                }
                status.innerHTML = '<i class="fa-regular fa-circle-check"></i> Guardado!';
                status.style.display = 'inline';
                setTimeout(() => { status.style.display = 'none'; }, 3000);
            } catch (e) {
                alert('Error al guardar: ' + e.message);
            }
        }

        let currentPage = 1;
        const PAGE_SIZE = 15;

        async function refreshFiles() {
            const res = await fetch(`/api/outputs?page=${currentPage}&page_size=${PAGE_SIZE}`);
            const data = await res.json();
            const list = document.getElementById('fileList');
            list.innerHTML = '';

            if (!data.folders || data.folders.length === 0) {
                list.innerHTML = '<li style="color:#6b7280; padding:12px;">No hay archivos generados aún.</li>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            data.folders.forEach(folder => {
                const li = document.createElement('li');
                li.className = 'file-item';
                const dateStr = new Date(folder.modified * 1000).toLocaleDateString();
                let skillsHtml = '';


                // Other skill files
                folder.skills.forEach((sk, i) => {
                    const baseName = sk.filename.replace('.md', '');
                    const icon = baseName === 'presentation' ? 'fa-envelope' : baseName === 'cv' ? 'fa-file-lines' : baseName === 'interview' ? 'fa-circle-question' : baseName === 'jobsynthesis' ? 'fa-clipboard' : 'fa-file-lines';
                    skillsHtml += `
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="display:inline-flex; align-items:center; gap:4px; min-width:200px;">
                                <i class="fa-regular ${icon}"></i> ${baseName}
                            </span>
                            <a href="javascript:void(0)" onclick="showFileModal('${sk.rel_path}')" style="font-size:12px;"><i class="fa-regular fa-eye"></i></a>
                            <a href="/api/file/${encodeURIComponent(sk.rel_path)}?download=true" style="font-size:12px;"><i class="fa-solid fa-download"></i></a>
                            <a href="/api/pdf/${encodeURIComponent(sk.rel_path)}" target="_blank" style="font-size:12px;"><i class="fa-regular fa-file-pdf"></i></a>
                        </div>
                    `;
                });

                const liId = `folder-${folder.name.replace(/[^a-zA-Z0-9]/g, '_')}`;
                const hasMd = folder.job_md_content || false;

                let linkLine = '';
                if (folder.link) {
                    linkLine = `<div style="font-size:12px; word-break:break-all;">
                        <i class="fa-solid fa-link" style="color:#6b7280;"></i> <a href="${folder.link}" target="_blank" style="color:#2571aa;">${folder.link}</a>
                    </div>`;
                }
                if (hasMd) {
                    linkLine += `
                        <div style="font-size:12px; margin-top:2px;">
                            <span style="cursor:pointer; color:#6b7280;" onclick="showFileModal('${folder.folder_path}/job.md', true)"><i class="fa-regular fa-eye"></i> ver detalle</span>
                        </div>
                    `;
                }

                li.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:6px; width:100%;">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
                            <strong style="font-size:15px;">${folder.name}</strong>
                            <span style="font-size:12px; color:#6b7280;">${dateStr}</span>
                        </div>
                        ${linkLine}
                        <div style="font-size:13px; display:flex; flex-direction:column; gap:4px;">
                            ${skillsHtml}
                        </div>
                    </div>
                `;
                list.appendChild(li);
            });

            // Pagination controls
            const pag = document.getElementById('pagination');
            pag.innerHTML = '';
            const prevBtn = document.createElement('button');
            prevBtn.className = 'btn-secondary';
            prevBtn.textContent = '‹ Anterior';
            prevBtn.disabled = data.page <= 1;
            prevBtn.onclick = () => { currentPage--; refreshFiles(); };
            pag.appendChild(prevBtn);

            const info = document.createElement('span');
            info.style.cssText = 'font-size: 13px; color: #6b7280;';
            info.textContent = `Pág. ${data.page} de ${data.total_pages} (${data.total} carpetas)`;
            pag.appendChild(info);

            const nextBtn = document.createElement('button');
            nextBtn.className = 'btn-secondary';
            nextBtn.textContent = 'Siguiente ›';
            nextBtn.disabled = data.page >= data.total_pages;
            nextBtn.onclick = () => { currentPage++; refreshFiles(); };
            pag.appendChild(nextBtn);
        }

        function copyPath() {
            const path = document.getElementById('outputDirPath').textContent;
            navigator.clipboard.writeText(path).then(() => {
                document.getElementById('copied').style.display = 'inline';
                setTimeout(() => {
                    document.getElementById('copied').style.display = 'none';
                }, 2000);
            });
        }

        function clearStatus() {
            document.getElementById('saveStatus').style.display = 'none';
        }

        window.addEventListener('load', () => {
            loadCv();
            refreshFiles();
            loadDiscoveryJobs();
            setInterval(refreshFiles, 5000);
        });

        // ── Discovery / Search ────────────────────────────
        let discoveryDebounce = null;
        function debouncedLoadDiscoveryJobs() {
            clearTimeout(discoveryDebounce);
            discoveryDebounce = setTimeout(loadDiscoveryJobs, 300);
        }

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        async function runSearch() {
            const btn = document.getElementById('searchBtn');
            const status = document.getElementById('searchStatus');
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) { alert('Ingresá una búsqueda.'); return; }
            btn.disabled = true; status.style.display = 'inline';
            try {
                const body = {
                    query: query,
                    source: document.getElementById('searchSource').value,
                    country: document.getElementById('searchCountry').value.trim() || 'us',
                    num_pages: parseInt(document.getElementById('searchPages').value || '1', 10),
                    date_posted: document.getElementById('searchDate').value,
                    employment_types: document.getElementById('searchEmployment').value.trim(),
                    remote_only: document.getElementById('searchRemote').checked,
                };
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
                renderJobs(data.jobs || []);
                document.getElementById('jobsCount').textContent = `${(data.jobs||[]).length} resultado(s) de la búsqueda (${data.source || ''})`;
            } catch (e) {
                alert('Error en búsqueda: ' + e.message);
            } finally {
                btn.disabled = false; status.style.display = 'none';
            }
        }

        async function loadDiscoveryJobs() {
            const decision = document.getElementById('filterDecision') ? document.getElementById('filterDecision').value : '';
            const q = document.getElementById('filterText') ? document.getElementById('filterText').value.trim() : '';
            const params = new URLSearchParams();
            if (decision) params.set('decision', decision);
            if (q) params.set('q', q);
            try {
                const res = await fetch('/api/discovery/jobs?' + params.toString());
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error');
                renderJobs(data.jobs || []);
                document.getElementById('jobsCount').textContent = `${(data.jobs||[]).length} propuesta(s) guardadas`;
            } catch (e) {
                console.error(e);
            }
        }

        function decisionPill(dec) {
            if (dec === 'interested') return '<span class="pill pill-interested">Me interesa</span>';
            if (dec === 'rejected') return '<span class="pill pill-rejected">No me interesa</span>';
            return '<span class="pill pill-pending">Pendiente</span>';
        }

        function skillLabel(skill) {
            const map = {jobsynthesis:'Análisis', createcv:'CV', presentationletter:'Carta', interviewquestions:'Entrevista'};
            return map[skill] || skill;
        }

        function renderExistingOutputs(existing) {
            const list = Array.isArray(existing) ? existing : [];
            if (!list.length) return '<span style="color:#9ca3af;font-size:12px;">Sin salidas guardadas</span>';
            return '<span style="font-size:12px;color:#374151;">Salidas: </span>' + list.map(s => `<span class="badge" title="Ya existe salida guardada para ${esc(skillLabel(s))}">${esc(skillLabel(s))} ✓</span>`).join(' ');
        }

        function setJobStatus(jobKey, msg, kind) {
            const sid = 'status-' + jobKey.replace(/[^a-zA-Z0-9_-]/g,'_');
            const el = document.getElementById(sid);
            if (!el) return;
            el.style.display = msg ? 'block' : 'none';
            el.textContent = msg || '';
            el.style.color = kind === 'error' ? '#dc2626' : (kind === 'ok' ? '#16a34a' : '#6b7280');
        }

        function renderJobs(jobs) {
            const list = document.getElementById('jobsList');
            if (!list) return;
            if (!jobs || jobs.length === 0) {
                list.innerHTML = '<div style="color:#6b7280;padding:12px;">No hay propuestas. Hacé una búsqueda o recargá las guardadas.</div>';
                return;
            }
            list.innerHTML = jobs.map(job => {
                const key = job._job_key || job.job_id || '';
                const safeId = String(key).replace(/[^a-zA-Z0-9_-]/g,'_');
                const title = esc(job.job_title || 'Sin título');
                const emp = esc(job.employer_name || 'Sin empresa');
                const loc = esc(job.job_location || (job.job_is_remote ? 'Remoto' : ''));
                const link = job.job_apply_link || job.job_google_link || '';
                const desc = esc((job.job_description || '').slice(0, 350));
                const dec = job._decision || 'pending';
                const remote = job.job_is_remote ? '<span class="badge">Remoto</span>' : '';
                const salary = job.job_salary ? `<span class="badge">${esc(job.job_salary)}</span>` : '';
                const score = (job._score != null) ? `<span class="badge" title="Afinidad heurística con tu CV">Afinidad: ${esc(job._score)}</span>` : '';
                const existing = job._existing_outputs || [];
                const src = job._source ? `<span class="badge" title="Fuente">${esc(job._source)}</span>` : '';
                let dupe = '';
                if (job._dupe_group_size && job._dupe_group_size > 1) {
                    const peers = Array.isArray(job._dupe_sources) ? job._dupe_sources.join(', ') : '';
                    dupe = `<span class="badge" style="background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;" title="Posible duplicado (mismo título/empresa/link)${peers ? ' · también en: ' + esc(peers) : ''}">Posible duplicado${peers ? ' · ' + esc(peers) : ''}</span>`;
                }
                return `
                <div class="job-card" data-key="${esc(key)}">
                    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;">
                        <div>
                            <div class="job-title">${title}</div>
                            <div class="job-meta">${emp}${loc ? ' · ' + loc : ''} ${src} ${remote} ${salary} ${score} ${dupe}</div>
                        </div>
                        <div>${decisionPill(dec)}</div>
                    </div>
                    ${link ? `<div style="font-size:13px;margin-bottom:6px;"><a href="${esc(link)}" target="_blank"><i class="fa-solid fa-link"></i> Ver oferta</a></div>` : ''}
                    ${desc ? `<div class="job-desc">${desc}${(job.job_description||'').length>350?'…':''}</div>` : ''}
                    <div id="existing-${safeId}" style="margin-bottom:8px;">${renderExistingOutputs(existing)}</div>
                    <div class="action-bar">
                        <button class="btn-sm btn-yes" onclick="setDecision('${esc(key)}','interested')"><i class="fa-regular fa-thumbs-up"></i> Me interesa</button>
                        <button class="btn-sm btn-no" onclick="setDecision('${esc(key)}','rejected')"><i class="fa-regular fa-thumbs-down"></i> No me interesa</button>
                        <button class="btn-sm btn-neutral" onclick="setDecision('${esc(key)}','pending')">Pendiente</button>
                        <button class="btn-sm btn-outline-primary" onclick="enrichFromDiscovery('${esc(key)}')" title="Traer detalles completos y guardar en índice (sin LLM)"><i class="fa-solid fa-download"></i> Enriquecer</button>
                        <select id="skill-${safeId}" style="width:auto;padding:6px 8px;font-size:13px;">
                            <option value="jobsynthesis">Análisis</option>
                            <option value="createcv">CV</option>
                            <option value="presentationletter">Carta</option>
                            <option value="interviewquestions">Entrevista</option>
                        </select>
                        <label style="font-size:12px;color:#374151;display:inline-flex;align-items:center;gap:4px;"><input type="checkbox" id="force-${safeId}"> Forzar regenerar</label>
                        <button class="btn-sm btn-outline-primary" onclick="generateFromDiscovery('${esc(key)}')"><i class="fa-solid fa-wand-magic-sparkles"></i> Generar</button>
                        <button class="btn-sm btn-outline-primary" onclick="showDiscoveryDetail('${esc(key)}')"><i class="fa-regular fa-eye"></i> Detalle</button>
                    </div>
                    <div id="status-${safeId}" style="display:none;margin-top:6px;font-size:13px;"></div>
                </div>`;
            }).join('');
        }

        async function setDecision(jobKey, decision) {
            try {
                const res = await fetch('/api/discovery/decision', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_key: jobKey, decision: decision })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error');
                await loadDiscoveryJobs();
            } catch (e) {
                alert('Error al guardar decisión: ' + e.message);
            }
        }

        async function enrichFromDiscovery(jobKey) {
            setJobStatus(jobKey, 'Enriqueciendo detalles (sin LLM)...', 'info');
            try {
                const res = await fetch('/api/discovery/enrich', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_key: jobKey })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error al enriquecer');
                setJobStatus(jobKey, 'Detalles enriquecidos y guardados en el índice.', 'ok');
                await loadDiscoveryJobs();
            } catch (e) {
                setJobStatus(jobKey, 'Error al enriquecer: ' + e.message, 'error');
            }
        }

        async function generateFromDiscovery(jobKey) {
            const safeId = jobKey.replace(/[^a-zA-Z0-9_-]/g,'_');
            const sel = document.getElementById('skill-' + safeId);
            const forceEl = document.getElementById('force-' + safeId);
            const skill = sel ? sel.value : 'jobsynthesis';
            const force = !!(forceEl && forceEl.checked);
            setJobStatus(jobKey, (force ? 'Regenerando' : 'Generando') + ' ' + skillLabel(skill) + ' (LLM, a pedido)...', 'info');
            try {
                const res = await fetch('/api/discovery/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_key: jobKey, skill: skill, force: force })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
                if (data.skipped) {
                    setJobStatus(jobKey, 'Salida existente reutilizada (sin gastar tokens). Activá "Forzar regenerar" para volver a generar.', 'ok');
                } else {
                    setJobStatus(jobKey, 'Generado: ' + (data.filename || skill) + (data.rel_path ? ' → ' + data.rel_path : ''), 'ok');
                }
                if (Array.isArray(data.existing_outputs)) {
                    const ex = document.getElementById('existing-' + safeId);
                    if (ex) ex.innerHTML = renderExistingOutputs(data.existing_outputs);
                } else {
                    await loadDiscoveryJobs();
                }
                refreshFiles();
            } catch (e) {
                setJobStatus(jobKey, 'Error al generar: ' + e.message, 'error');
            }
        }

        async function showDiscoveryDetail(jobKey) {
            try {
                const res = await fetch('/api/discovery/job/' + encodeURIComponent(jobKey));
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error');
                const job = data.job || {};
                const existing = (job._existing_outputs || []).map(skillLabel).join(', ') || 'ninguna';
                const dupInfo = (job._dupe_group_size && job._dupe_group_size > 1) ? `Sí (${job._dupe_group_size} en grupo${(job._dupe_sources||[]).length ? ', también en: ' + (job._dupe_sources||[]).join(', ') : ''})` : 'No';
                const text = `Título: ${job.job_title || ''}\nEmpresa: ${job.employer_name || ''}\nUbicación: ${job.job_location || ''}\nFuente: ${job._source || ''}\nRemoto: ${job.job_is_remote ? 'Sí' : 'No'}\nSalario: ${job.job_salary || ''}\nAfinidad (heurística CV): ${job._score != null ? job._score : 'n/a'}\nLink: ${job.job_apply_link || job.job_google_link || ''}\nEstado: ${job._decision || 'pending'}\nSalidas existentes: ${existing}\nPosible duplicado: ${dupInfo}\n\nDescripción:\n${job.job_description || ''}`;
                showFileModalFromText(job.job_title || 'Detalle', text);
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        function showFileModalFromText(title, text) {
            const modal = document.getElementById('fileModal');
            document.getElementById('modalTitle').textContent = title;
            const editor = document.getElementById('modalEditor');
            const viewer = document.getElementById('modalViewer');
            const viewerPre = viewer.querySelector('pre');
            const saveBtn = document.getElementById('modalSaveBtn');
            document.getElementById('modalDownloadBtn').onclick = null;
            document.getElementById('modalPdfBtn').onclick = null;
            editor.style.display = 'none';
            viewer.style.display = 'block';
            viewerPre.textContent = text;
            saveBtn.style.display = 'none';
            modal.classList.add('open');
        }

    </script>
    <!-- ── Modal ─────────────────────────────────────────── -->
    <div class="modal-overlay" id="fileModal" onclick="if(event.target===this) closeFileModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Archivo</h3>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button class="btn-outline-primary" id="modalDownloadBtn"><i class="fa-solid fa-download"></i> Descargar</button>
                    <button class="btn-outline-primary" id="modalPdfBtn"><i class="fa-regular fa-file-pdf"></i> PDF</button>
                    <button class="btn-outline-primary" id="modalSaveBtn" style="display:none;"><i class="fa-regular fa-floppy-disk"></i> Guardar</button>
                    <button class="modal-close" onclick="closeFileModal()">&times;</button>
                </div>
            </div>
            <div class="modal-body" id="modalBody">
                <textarea id="modalEditor" class="output-editor" style="display:block;min-height:300px;font-size:14px;"></textarea>
                <div id="modalViewer" style="display:none; background:#f9fafb; border:1px solid #e5e7eb; border-radius:6px; padding:20px; overflow-y:auto; min-height:300px; max-height:600px;"><pre style="margin:0; white-space:pre-wrap; word-break:break-word; font-size:14px; line-height:1.5; font-family:'SF Mono','Fira Code','Consolas',monospace;"></pre></div>
                <span id="modalStatus" style="display:none;font-size:13px;padding:4px 0;"></span>
            </div>
        </div>
    </div>

    <script>
        let modalPath = '';

        function showFileModal(relPath, readOnly) {
            modalPath = relPath;
            const modal = document.getElementById('fileModal');
            const title = document.getElementById('modalTitle');
            const editor = document.getElementById('modalEditor');
            const viewer = document.getElementById('modalViewer');
            const viewerPre = viewer ? viewer.querySelector('pre') : null;
            const status = document.getElementById('modalStatus');
            const saveBtn = document.getElementById('modalSaveBtn');
            const downloadBtn = document.getElementById('modalDownloadBtn');
            const pdfBtn = document.getElementById('modalPdfBtn');

            title.textContent = relPath.split('/').pop();
            status.style.display = 'none';

            if (readOnly) {
                editor.style.display = 'none';
                viewer.style.display = 'block';
                viewerPre.textContent = 'Cargando...';
                saveBtn.style.display = 'none';
            } else {
                editor.style.display = 'block';
                viewer.style.display = 'none';
                editor.value = 'Cargando...';
                editor.disabled = true;
                saveBtn.style.display = 'none';
            }

            modal.classList.add('open');

            const encoded = encodeURIComponent(relPath);
            downloadBtn.onclick = () => window.open('/api/file/' + encoded + '?download=true', '_blank');
            pdfBtn.onclick = () => window.open('/api/pdf/' + encoded, '_blank');

            fetch('/api/file/' + encoded)
                .then(r => {
                    if (!r.ok) throw new Error(r.statusText);
                    return r.text();
                })
                .then(text => {
                    if (readOnly) {
                        viewerPre.textContent = text;
                    } else {
                        editor.value = text;
                        editor.disabled = false;
                        saveBtn.style.display = 'inline-flex';
                    }
                })
                .catch(err => {
                    const msg = 'Error al cargar el archivo: ' + err.message;
                    if (readOnly) {
                        viewerPre.textContent = msg;
                    } else {
                        editor.value = msg;
                        editor.disabled = true;
                    }
                });
        }

        document.getElementById('modalSaveBtn').onclick = function() {
            const editor = document.getElementById('modalEditor');
            const status = document.getElementById('modalStatus');
            status.style.display = 'block';
            status.className = '';
            status.textContent = 'Guardando...';

            fetch('/api/file/' + encodeURIComponent(modalPath), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: editor.value }),
            })
                .then(r => {
                    if (!r.ok) throw new Error(r.statusText);
                    return r.json();
                })
                .then(data => {
                    status.className = 'success-msg';
                    status.innerHTML = '<i class="fa-regular fa-circle-check"></i> Guardado';
                    setTimeout(() => { status.style.display = 'none'; }, 2000);
                })
                .catch(err => {
                    status.className = 'error-msg';
                    status.innerHTML = '<i class="fa-regular fa-circle-xmark"></i> Error: ' + err.message;
                });
        };

        function closeFileModal() {
            document.getElementById('fileModal').classList.remove('open');
        }
    </script>
</body>
</html>
