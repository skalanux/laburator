[project]
name = "laburator"
version = "0.1.0"
description = "CLI job-search assistant powered by LangGraph"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Santiago Kalerman" },
]
keywords = ["job-search", "cli", "langgraph", "llm", "career"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: News/Diary",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "langgraph>=0.2",
    "httpx>=0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.urls]
Homepage = "https://github.com/skalerman/laburator"
Repository = "https://github.com/skalerman/laburator"

[project.scripts]
laburator = "laburator.cli:app"

[tool.uv.sources]
laburator = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.15",
]

[build-system]
requires = ["uv_build>=0.9.1,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"
