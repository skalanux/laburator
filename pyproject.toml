[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laburator"
version = "0.1.0"
description = "CLI job-search assistant powered by LangGraph"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "langgraph>=0.2",
    "httpx>=0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
laburator = "laburator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
